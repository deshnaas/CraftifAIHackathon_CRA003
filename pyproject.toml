[project]
name = "sentinel"
version = "0.2.0"
description = "Reliability monitoring for edge computer-vision pipelines (local prototype)"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "opencv-python-headless>=4.10", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]
dev = ["pytest>=8", "jsonschema>=4", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
